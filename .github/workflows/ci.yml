name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-check:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            epec-consumos-webhooks-server/package-lock.json
            epec-consumption-reporting-extension/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run check
